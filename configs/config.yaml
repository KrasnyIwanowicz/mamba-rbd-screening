# mamba-rbd-screening default config
# Mirrors the config.yaml pattern from mamba-eeg-sleep-staging / parkinsons-eeg-classifier

data:
  cap_root: "data/raw/capslpdb"        # PhysioNet CAP Sleep Database
  groups_include: ["rbd", "n"]         # 22 RBD patients + 16 normal controls (n = healthy)
  sample_rate_hz: 200                  # CAPSleepLoader target_fs; EMG band 10-90 Hz needs >=200 Hz
                                       # (the stager gets its own 100 Hz copy, see src/staging/cap_stager.py)
  epoch_length_s: 30                   # standard AASM epoch length, matches sleep-stager

sleep_stager:
  # src/train.py in the submodule saves <out_dir>/<encoder>_best.pt (default out_dir=results).
  # Not in git (*.pt ignored) -- train it or copy it here before Phase 2.
  checkpoint: "external/sleep_staging/results/mamba_best.pt"
  sequence_encoder: "mamba"
  input: "raw volts, 100 Hz, no bandpass/zscore"   # matches how the checkpoint was trained
  # NOTE: this checkpoint was trained on Sleep-EDF-20 (different hardware/montage
  # than CAP). Phase 2 must measure the domain-shift drop before trusting outputs.

rswa_scoring:                   # rule-based, src/rswa_scoring.py (CAP has no per-epoch RSWA labels)
  emg_band_hz: [10, 100]        # upper edge capped at 0.45*fs (90 Hz @ 200 Hz)
  mains_notch_hz: 50
  mini_epoch_s: 3.0
  background_percentile: 10
  threshold_multiplier: 2.0
  decision_threshold: null      # choose under LOSO (scripts/evaluate_rswa.py), never copy from papers

rswa_detector:
  emg_channel_candidates: ["chin", "submental", "EMG1-EMG2"]  # regexes in src/data/cap_loader.py; EMG1-EMG2 is NOT proof of chin placement
  feature_set: ["emg_rms", "emg_variance", "eeg_theta_power", "eeg_beta_power"]
  model: "logistic_regression"   # baseline first, same discipline as SVM-first in the PD project
  use_dt_aware_block: false      # Phase 4: flip only after a fair head-to-head test, not by default

validation:
  scheme: "leave_one_subject_out"
  seeds: [0, 1, 2]

training:
  lr: 1.0e-3
  batch_size: 16
  max_epochs: 30
  grad_clip_norm: 1.0
